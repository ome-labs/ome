# The fast checks: format, lint, types, unit and integration tests, WebAssembly, the contract and the image. The
# slow suites (local network, removal drill, networks, mobile bindings, Testnet) are in extended.yml.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs these checks on the commit it releases.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings .
      - run: shellcheck scripts/*.sh scripts/packaging/*.sh
      # The wallet, the daemon and the launcher that depends on it need the contract artifact and the WebAssembly
      # build; they have their own job.
      - run: pnpm exec turbo run lint typecheck build test '--filter=./packages/*' '--filter=!@ome-labs/wallet' '--filter=!@ome-labs/daemon' '--filter=!@ome-labs/ome'

  vectors:
    name: Golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates every vector file from the pinned Aztec packages and fails if a committed file differs.
      - run: pnpm --filter @ome-labs/vectors test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: scripts/cargo.sh fmt --all --check
      - run: scripts/cargo.sh clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: scripts/cargo.sh test --workspace --all-features --locked
      - name: Slow tests
        if: github.ref == 'refs/heads/main'
        env:
          PROPTEST_CASES: "1024"
        run: scripts/cargo.sh test --workspace --all-features --locked -- --ignored
      - name: Core crates build for WebAssembly
        run: scripts/wasm-core.sh
      - run: scripts/cargo.sh deny check

  api:
    name: API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates @ome-labs/api and the ome-wasm boundary types and fails if the committed declarations differ.
      - run: pnpm --filter @ome-labs/api generate
      - run: pnpm --filter @ome-labs/wasm generate
      - run: git diff --exit-code -- packages/api crates/wasm/src/types.d.ts

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      # The CLI must match the wasm-bindgen crate in crates/Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ome-labs/wasm build
      - run: pnpm --filter @ome-labs/wasm typecheck
      - run: pnpm --filter @ome-labs/wasm test

  wallet:
    name: Wallet and daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - uses: ./.github/actions/aztec
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the contract artifact and @ome-labs/wasm first. The end-to-end suite needs a local network and runs
      # outside CI (pnpm --filter @ome-labs/wallet test:e2e).
      - run: pnpm exec turbo run typecheck test --filter=@ome-labs/wallet --filter=@ome-labs/daemon --filter=@ome-labs/ome

  noir:
    name: Noir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      # The job uses no pnpm; setup-node would otherwise cache for the root packageManager.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/aztec
      - run: aztec-nargo fmt --workspace --check
      - run: aztec-nargo check --workspace --deny-warnings
      - run: node ../scripts/noir-failure-messages.ts ome_vault
      - run: aztec compile
      - run: aztec test

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's Docker uses BuildKit, which the Dockerfile's cache mounts need.
      - run: docker build -f crates/relay/deploy/Dockerfile --target relay -t ome-relay:ci crates
      - run: docker build -f crates/relay/deploy/Dockerfile --target keeper -t ome-keeper:ci crates
      - run: docker run --rm ome-keeper:ci ome-keeper --version
      - name: The relay starts and reports healthy
        run: |
          docker run -d --name relay -p 127.0.0.1:9090:9090 ome-relay:ci
          for _ in $(seq 1 30); do
            curl -fsS 127.0.0.1:9090/health && exit 0
            sleep 1
          done
          docker logs relay
          exit 1
