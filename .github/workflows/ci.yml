name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings .
      # The wallet and the daemon need the contract artifact and the WebAssembly build; they have their own job.
      - run: pnpm exec turbo run lint typecheck build test '--filter=./packages/*' '--filter=!@ome-labs/wallet' '--filter=!@ome-labs/daemon'

  vectors:
    name: Golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates every vector file from the pinned Aztec packages and fails if a committed file differs.
      - run: pnpm --filter @ome-labs/vectors test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: scripts/cargo.sh fmt --all --check
      - run: scripts/cargo.sh clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: scripts/cargo.sh test --workspace --all-features --locked
      - name: Slow tests
        if: github.ref == 'refs/heads/main'
        env:
          PROPTEST_CASES: "1024"
        run: scripts/cargo.sh test --workspace --all-features --locked -- --ignored
      - name: Core crates build for WebAssembly
        run: scripts/wasm-core.sh
      - run: scripts/cargo.sh deny check

  api:
    name: API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates @ome-labs/api and the ome-wasm boundary types and fails if the committed declarations differ.
      - run: pnpm --filter @ome-labs/api generate
      - run: pnpm --filter @ome-labs/wasm generate
      - run: git diff --exit-code -- packages/api crates/wasm/src/types.d.ts

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      # The CLI must match the wasm-bindgen crate in crates/Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ome-labs/wasm build
      - run: pnpm --filter @ome-labs/wasm typecheck
      - run: pnpm --filter @ome-labs/wasm test

  wallet:
    name: Wallet and daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - name: Cache Aztec toolchain and Nargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.aztec
            ~/nargo
          key: aztec-${{ hashFiles('.aztecrc') }}-${{ hashFiles('contracts/**/Nargo.toml') }}
          restore-keys: aztec-${{ hashFiles('.aztecrc') }}-
      - name: Install Aztec
        run: |
          VERSION="$(cat .aztecrc)"
          if [ ! -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ]; then
            curl -fsSL "https://install.aztec-labs.com/$VERSION/install" | VERSION="$VERSION" bash
          fi
          ln -sfn "$HOME/.aztec/versions/$VERSION" "$HOME/.aztec/current"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the contract artifact and @ome-labs/wasm first. The end-to-end suite needs a local network and runs
      # outside CI (pnpm --filter @ome-labs/wallet test:e2e).
      - run: pnpm exec turbo run typecheck test --filter=@ome-labs/wallet --filter=@ome-labs/daemon

  apple:
    name: Mobile bindings (Apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated Swift on the macOS host, then the XCFramework for iOS, the iOS Simulator and macOS.
      - run: pnpm --filter @ome-labs/ffi mobile:swift
      - run: pnpm --filter @ome-labs/ffi mobile:apple

  android:
    name: Mobile bindings (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: crates
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - run: cargo install cargo-ndk --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated Kotlin on the JVM, then the AAR for arm64-v8a and x86_64.
      - run: pnpm --filter @ome-labs/ffi mobile:kotlin
      # The runner image ships Android NDKs; build with the newest.
      - run: pnpm --filter @ome-labs/ffi mobile:android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

  noir:
    name: Noir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      # The job uses no pnpm; setup-node would otherwise cache for the root packageManager.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Cache Aztec toolchain and Nargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.aztec
            ~/nargo
          key: aztec-${{ hashFiles('.aztecrc') }}-${{ hashFiles('contracts/**/Nargo.toml') }}
          restore-keys: aztec-${{ hashFiles('.aztecrc') }}-
      - name: Install Aztec
        working-directory: .
        run: |
          VERSION="$(cat .aztecrc)"
          if [ ! -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ]; then
            curl -fsSL "https://install.aztec-labs.com/$VERSION/install" | VERSION="$VERSION" bash
          fi
          ln -sfn "$HOME/.aztec/versions/$VERSION" "$HOME/.aztec/current"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
      - run: aztec-nargo fmt --workspace --check
      - run: aztec-nargo check --workspace --deny-warnings
      - run: node ../scripts/noir-failure-messages.ts ome_vault
      - run: aztec compile
      - run: aztec test

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's Docker uses BuildKit, which the Dockerfile's cache mounts need.
      - run: docker build -f relay/deploy/Dockerfile -t ome-node:ci crates
      - name: The relay starts and reports healthy
        run: |
          docker run -d --name relay -p 127.0.0.1:9090:9090 ome-node:ci
          for _ in $(seq 1 30); do
            curl -fsS 127.0.0.1:9090/health && exit 0
            sleep 1
          done
          docker logs relay
          exit 1
