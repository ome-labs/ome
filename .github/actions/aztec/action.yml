name: Install Aztec
description: Installs the Aztec toolchain pinned in .aztecrc, with the Nargo dependencies cached.
runs:
  using: composite
  steps:
    - name: Cache Aztec toolchain and Nargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.aztec
          ~/nargo
        key: aztec-${{ runner.os }}-${{ hashFiles('.aztecrc') }}-${{ hashFiles('contracts/**/Nargo.toml') }}
        restore-keys: aztec-${{ runner.os }}-${{ hashFiles('.aztecrc') }}-
    - name: Install Aztec
      shell: bash
      run: |
        VERSION="$(cat "$GITHUB_WORKSPACE/.aztecrc")"
        # The installer fetches Foundry and Aztec's tools from GitHub, which sometimes answers 5xx: retry it.
        for attempt in 1 2 3; do
          [ -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ] && break
          curl -fsSL "https://install.aztec-labs.com/$VERSION/install" | VERSION="$VERSION" bash && break
          [ "$attempt" = 3 ] && exit 1
          sleep 30
        done
        ln -sfn "$HOME/.aztec/versions/$VERSION" "$HOME/.aztec/current"
        echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/current/bin" >> "$GITHUB_PATH"
