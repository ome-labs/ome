[package]
name = "ome-keeper"
description = "An Ome member's always-on keeper: viewing-share custody, ceremonies and threshold ECDH"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
