[workspace]
resolver = "3"
# Add each crate folder here as it lands (folders carry no `ome` prefix; package names do: `crypto` builds `ome-crypto`).
members = ["crypto", "keeper", "net", "protocol", "signer", "wire"]
# The fuzz crate needs nightly and has its own workspace.
exclude = ["wire/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ome-labs/ome"
rust-version = "1.99"
publish = false

# Shared dependency versions; crates opt in with `dep = { workspace = true }` and add features locally.
#
# Core crates (ome-crypto, ome-wire, ome-protocol, ome-signer) must build for `wasm32-unknown-unknown` and mobile
# targets as well as natively, so shared dependencies start with default features off and core crates do no I/O.
# They are not `no_std`: taceo-poseidon2 always enables ark-std's `std` and `getrandom` features. On WebAssembly that
# `getrandom` needs its `js` backend, which the crate depending on taceo-poseidon2 declares for `target_family = "wasm"`.
# Randomness reaches core code only as `rand_core` trait parameters.
[workspace.dependencies]
# Ome crates.
ome-crypto = { path = "crypto" }
ome-net = { path = "net" }
ome-protocol = { path = "protocol" }
ome-wire = { path = "wire" }

# Curve and field arithmetic (Grumpkin over BN254) and Aztec's Poseidon2.
ark-ec = { version = "0.6.0", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-grumpkin = { version = "0.6.0", default-features = false }
taceo-poseidon2 = { version = "0.3.1", default-features = false, features = ["bn254", "t4"] }

# Secret handling.
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc", "derive"] }

# Randomness. `getrandom` is pinned to the 0.2 series on purpose: it is the version ark-std 0.6 depends on, and only
# that version's `js` feature reaches it (the latest getrandom, 0.4, would be a separate, unused copy).
getrandom = { version = "0.2.17", features = ["js"] }
rand_core = { version = "0.10.1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }

# Encryption, signatures and hashing.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
hmac = { version = "0.13.0", default-features = false }
hpke = { version = "0.15.1", default-features = false, features = [
  "alloc",
  "chacha",
  "hkdfsha2",
  "x25519",
] }
sha2 = { version = "0.11.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
  "zeroize",
] }

# Encoding and errors.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.21", default-features = false }

# JSON for small human-readable files (the sealed signing key) and test vectors.
hex = "0.4.3"
serde_json = "1.0.154"

# Networking (native only: keepers, the relay and clients that talk to them directly).
futures = "0.3.34"
libp2p = { version = "0.57.1", default-features = false, features = [
  "dcutr",
  "dns",
  "ed25519",
  "identify",
  "macros",
  "noise",
  "ping",
  "quic",
  "relay",
  "request-response",
  "tcp",
  "tokio",
  "yamux",
] }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Keeper storage and randomness (native only).
os-rng = { package = "getrandom", version = "0.4.3", features = ["sys_rng"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Keeper binary.
clap = { version = "4.6.7", features = ["derive", "env"] }
toml = "1.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Test-only.
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

# Argon2id at 64 MiB takes seconds unoptimized; tests and debug builds of the signer optimize it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
