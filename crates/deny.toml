# cargo-deny: dependency policy for the Ome Rust workspace.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each accepted advisory names the path that brings it in and why it is acceptable. Revisit on every libp2p upgrade.
ignore = [
  # `paste` (unmaintained, no vulnerability) is a compile-time macro helper reached through
  # libp2p-quic and libp2p-tcp → if-watch → netlink-packet-core. It runs no code in the built binary,
  # and no maintained release of that chain drops it yet.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro via libp2p's if-watch; no fixed release" },
  # `basic-toml` (unmaintained, no vulnerability) is read at compile time by askama's derive macros, which only
  # uniffi_bindgen uses: the developer-side generator of ome-ffi's Swift and Kotlin bindings (feature `bindgen`).
  # Nothing of it is in the library a phone links. Revisit on every UniFFI upgrade.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained compile-time TOML parser via uniffi_bindgen's askama; generator only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list anticipates future dependencies; unused entries are expected.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# UniFFI (ome-ffi's Swift and Kotlin bindings) is MPL-2.0: file-level copyleft, which covers changes to UniFFI's own
# files only. Allowed for these crates alone, not as a general license.
exceptions = [
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_bindgen" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_core" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_internal_macros" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_macros" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_meta" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_pipeline" },
  { allow = [
    "MPL-2.0",
  ], crate = "uniffi_udl" },
]

[licenses.private]
ignore = true

[bans]
# Duplicates are warnings, kept visible on purpose. Known sources:
# - arkworks 0.6 (ome-crypto) still uses digest 0.10 and rand_core 0.6 beside the latest versions Ome uses;
# - libp2p 0.57 (ome-net) uses the previous RustCrypto generation (chacha20poly1305 0.10, curve25519-dalek 4,
#   sha2 0.10, …), so those appear twice until libp2p moves to the current releases.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
